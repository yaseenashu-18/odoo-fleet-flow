{% extends "base.html" %}

{% block content %}
<div class="auth-container" style="max-width: 500px; margin-top: 2rem;">
    <div class="auth-header">
        <i class="fas fa-user-plus"></i>
        <h1>Add New Team Member</h1>
        <p>This member will be linked to your business.</p>
    </div>

    <form method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required placeholder="e.g. yaseen_office" pattern="^[a-zA-Z0-9_]+$">
        </div>
        <div class="form-group">
            <label>Role</label>
            <select name="role">
                <option value="Dispatcher">Office Staff</option>
                <option value="Maintenance">Mechanic</option>
                <option value="Driver">Fleet Driver</option>
            </select>
        </div>
        <div class="form-group">
            <label>Set Login Password</label>
            <input type="password" name="password" required placeholder="Member will use this to login">
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn btn-primary" style="flex: 1; padding: 1rem;">Create Account</button>
            <a href="{{ url_for('team') }}" class="btn"
                style="flex: 1; text-align: center; padding: 1rem; background: var(--glass-bg); color: var(--text-primary); text-decoration: none;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
